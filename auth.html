<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StandoffX — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef3ff;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#1556ff22,transparent 45%);pointer-events:none}
.card{width:min(430px,92vw);padding:34px;border:1px solid #ffffff12;background:#0d121cdd;border-radius:22px;box-shadow:0 30px 100px #0008;backdrop-filter:blur(20px)}
.logo{font-size:34px;font-weight:900;letter-spacing:-2px}.logo b{color:#3d8bff}.sub{color:#8491a7;margin:7px 0 28px}
.tabs{display:flex;gap:6px;background:#070a10;padding:5px;border-radius:12px;margin-bottom:20px}.tab{flex:1;border:0;background:transparent;color:#7f8aa0;padding:11px;border-radius:9px;cursor:pointer}.tab.active{background:#182235;color:white}
input{width:100%;padding:14px 15px;margin:7px 0;border-radius:11px;border:1px solid #ffffff12;background:#080c14;color:white;outline:none}input:focus{border-color:#397eff}
button.primary{width:100%;margin-top:12px;padding:14px;border:0;border-radius:11px;background:#2877ff;color:white;font-weight:800;cursor:pointer}button.primary:hover{filter:brightness(1.12)}
#msg{min-height:22px;color:#ff7180;margin-top:14px;font-size:14px}.hint{font-size:12px;color:#657086;margin-top:18px;text-align:center}
</style></head>
<body><main class="card">
<div class="logo">STANDOFF<b>X</b></div><div class="sub">Тактичний browser FPS</div>
<div class="tabs"><button class="tab active" id="loginTab">Увійти</button><button class="tab" id="regTab">Реєстрація</button></div>
<form id="form"><input id="nickname" autocomplete="username" placeholder="Нік або ID"><input id="password" autocomplete="current-password" type="password" placeholder="Пароль"><button class="primary" id="submit">Увійти</button></form>
<div id="msg"></div><div class="hint">StandoffX Dev Build</div>
</main>
<script>
let mode="login";
const $=id=>document.getElementById(id);
function setMode(next){mode=next;$("loginTab").classList.toggle("active",mode==="login");$("regTab").classList.toggle("active",mode==="register");$("submit").textContent=mode==="login"?"Увійти":"Створити акаунт";$("nickname").placeholder=mode==="login"?"Нік або ID":"Нікнейм"}
$("loginTab").onclick=()=>setMode("login");$("regTab").onclick=()=>setMode("register");
$("form").onsubmit=async e=>{e.preventDefault();$("msg").textContent="";const endpoint=mode==="login"?"/api/login":"/api/register";try{const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nickname:$("nickname").value,password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.message||"Помилка");location.href=d.redirect||"/game"}catch(err){$("msg").textContent=err.message}};
fetch("/api/me").then(r=>{if(r.ok)location.href="/game"}).catch(()=>{});
</script></body></html>
