<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StandoffX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b11;color:#edf3ff;font-family:Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}aside{background:#0b1018;border-right:1px solid #ffffff0d;padding:22px 14px;display:flex;flex-direction:column}.brand{font-size:25px;font-weight:900;padding:0 10px 25px}.brand b{color:#3d8bff}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#8995aa;text-align:left;padding:13px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:#152033;color:white}.bottom{margin-top:auto}.user{display:flex;gap:10px;align-items:center;background:#111925;border-radius:13px;padding:10px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#182335}.uid,.muted{color:#7d899e;font-size:13px}.danger{background:#35151c;color:#ff8d9b;border:0;padding:10px;border-radius:9px;cursor:pointer;width:100%;margin-top:8px}main{min-width:0}.top{height:70px;border-bottom:1px solid #ffffff0d;display:flex;justify-content:space-between;align-items:center;padding:0 30px}.content{padding:30px;max-width:1200px}.view{display:none}.view.active{display:block}.hero{min-height:350px;padding:36px;border-radius:22px;background:linear-gradient(110deg,#111d30,#0b1018);border:1px solid #ffffff0d;display:flex;align-items:flex-end}.eyebrow{color:#5793ff;font-size:12px;font-weight:800;letter-spacing:2px}.hero h2{font-size:54px;margin:10px 0}.hero p{color:#8491a7;max-width:520px}.primary,.secondary{border:0;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#2877ff;color:white}.secondary{background:#151e2c;color:#dce5f5;border:1px solid #ffffff10}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.panel,.item{background:#0d131d;border:1px solid #ffffff0c;border-radius:16px;padding:20px}.list{display:grid;gap:9px;margin-top:14px}.item{padding:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.big{font-size:27px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{display:flex;gap:8px;margin:14px 0}.search input,.modal input{background:#090e16;border:1px solid #ffffff14;color:white;padding:12px;border-radius:9px;outline:0}.search input{flex:1}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10}.modal.show{display:grid}.box{width:min(470px,92vw);background:#0d131d;border:1px solid #ffffff14;border-radius:18px;padding:24px}.box input{width:100%;margin:6px 0}.toast{position:fixed;right:20px;bottom:20px;background:#111b29;padding:13px 17px;border-radius:11px;display:none}.toast.show{display:block}@media(max-width:750px){.app{grid-template-columns:70px 1fr}.brand{font-size:0}.brand b{font-size:22px}.nav button{font-size:0}.content{padding:16px}.grid{grid-template-columns:1fr}.hero h2{font-size:40px}}
</style></head><body>
<div class="app"><aside><div class="brand">STANDOFF<b>X</b></div><nav class="nav">
<button class="active" data-view="home">PLAY</button><button data-view="profile">PROFILE</button><button data-view="friends">SOCIAL</button><button data-view="clan">CLAN</button><button data-view="inventory">INVENTORY</button><button data-view="market">MARKET</button><button data-view="stats">STATS</button></nav>
<div class="bottom"><div class="user"><img id="miniAvatar" class="avatar"><div><b id="miniName">...</b><div id="miniId" class="uid">...</div></div></div><button id="logout" class="danger">Вийти</button></div></aside>
<main><header class="top"><b id="title">Play</b><b id="gold">0 Gold</b></header><div class="content">
<section id="home" class="view active"><div class="hero"><div><div class="eyebrow">TEAM FIGHT / DEV BUILD</div><h2>STANDOFFX</h2><p>Browser FPS на Three.js. Шукай матч і заходь у бій.</p><button id="play" class="primary">ЗНАЙТИ МАТЧ</button></div></div><div class="grid"><div class="panel"><div class="muted">Competitive MMR</div><div id="mmr" class="big">1000</div></div><div class="panel"><div class="muted">XP</div><div id="xp" class="big">0</div></div><div class="panel"><div class="muted">Clan</div><div id="clanMini" class="big">—</div></div></div></section>
<section id="profile" class="view"><div class="panel"><h2>Профіль</h2><div class="row"><img id="profileAvatar" class="avatar" style="width:90px;height:90px"><div style="flex:1"><div id="profileName" class="big"></div><div id="profileId" class="muted"></div><div id="profileClan" class="muted"></div></div></div></div></section>
<section id="friends" class="view"><div class="panel"><h2>Соціал</h2><div class="search"><input id="friendSearch" placeholder="Нік або ID"><button id="friendFind" class="primary">Знайти</button></div><div id="friendResult"></div><h3>Друзі</h3><div id="friendList" class="list"></div><h3>Вхідні заявки</h3><div id="incoming" class="list"></div></div></section>
<section id="clan" class="view"><div class="panel"><div class="row"><h2>Клан</h2><button id="clanRefresh" class="secondary">Оновити</button></div><div id="clanBody"></div></div></section>
<section id="inventory" class="view"><div class="panel"><h2>Інвентар</h2><div id="inventoryList" class="grid"></div></div></section>
<section id="market" class="view"><div class="panel"><div class="row"><h2>Market</h2><button id="marketRefresh" class="secondary">Оновити</button></div><div id="marketList" class="list"></div></div></section>
<section id="stats" class="view"><div class="grid"><div class="panel"><div class="muted">MMR</div><div id="sMmr" class="big"></div></div><div class="panel"><div class="muted">XP</div><div id="sXp" class="big"></div></div><div class="panel"><div class="muted">Gold</div><div id="sGold" class="big"></div></div></div></section>
</div></main></div><div id="modal" class="modal"><div id="modalBox" class="box"></div></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let me=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){opt.credentials="same-origin";opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{});const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||"Помилка");return d}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function render(){if(!me)return;$("miniName").textContent=me.nickname;$("miniId").textContent=me.id;$("gold").textContent=(me.gold||0)+" Gold";$("mmr").textContent=me.MMRCompetitive||1000;$("xp").textContent=me.XP||0;$("clanMini").textContent=me.clan||"—";$("profileName").textContent=me.nickname;$("profileId").textContent=me.id;$("profileClan").textContent=me.clan?"Clan "+me.clan:"Без клану";$("sMmr").textContent=me.MMRCompetitive||1000;$("sXp").textContent=me.XP||0;$("sGold").textContent=me.gold||0;document.querySelectorAll(".avatar").forEach(x=>x.src=me.playerAvatar||"/avatars/default.jpg")}
function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.view===v));$("title").textContent=v.toUpperCase()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.view));$("logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.href="/"};$("play").onclick=()=>location.href="/play2.html";
$("friendFind").onclick=async()=>{try{const d=await api("/api/search-user",{method:"POST",body:JSON.stringify({query:$("friendSearch").value})});$("friendResult").innerHTML="<div class='item row'><b>"+esc(d.user.nickname)+"</b><button class='primary' onclick=\"addFriend('"+esc(d.user.id)+"')\">Додати</button></div>"}catch(e){toast(e.message)}};
async function addFriend(id){try{await api("/api/friends/request",{method:"POST",body:JSON.stringify({toId:id})});toast("Заявку відправлено");loadFriends()}catch(e){toast(e.message)}}
async function loadFriends(){try{const f=await api("/api/get-my-friends"),i=await api("/api/friends/incoming",{method:"POST"});$("friendList").innerHTML=f.friends.map(x=>"<div class='item row'><b>"+esc(x.nickname)+"</b><button class='secondary' onclick=\"friendAction('/api/friends/remove','"+esc(x.id)+"')\">Видалити</button></div>").join("")||"<span class='muted'>Немає друзів.</span>";$("incoming").innerHTML=i.incoming.map(x=>"<div class='item row'><b>"+esc(x.nickname)+"</b><div class='actions'><button class='primary' onclick=\"friendAction('/api/friends/accept','"+esc(x.id)+"')\">Прийняти</button><button class='secondary' onclick=\"friendAction('/api/friends/decline','"+esc(x.id)+"')\">Відхилити</button></div></div>").join("")||"<span class='muted'>Немає заявок.</span>"}catch(e){}}
async function friendAction(url,id){try{await api(url,{method:"POST",body:JSON.stringify({friendId:id})});loadFriends()}catch(e){toast(e.message)}}
async function loadClan(){try{const d=await api("/api/clans/my");if(!d.clan){$("clanBody").innerHTML="<p class='muted'>Ти не в клані.</p><button class='primary' onclick='createClan()'>Створити за 500 Gold</button> <button class='secondary' onclick='searchClans()'>Знайти</button>";return}$("clanBody").innerHTML="<h2>"+esc(d.clan.name)+" <span class='muted'>["+esc(d.clan.tag)+"]</span></h2><div class='muted'>Рівень "+d.clan.level+" · "+d.members.length+" учасників</div><div class='list'>"+d.members.map(x=>"<div class='item'>"+esc(x.nickname)+" <span class='muted'>"+x.role+"</span></div>").join("")+"</div><button class='danger' style='width:auto' onclick='leaveClan()'>Вийти</button>"}catch(e){toast(e.message)}}
function openModal(h){$("modalBox").innerHTML=h;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
function createClan(){openModal("<h2>Новий клан</h2><input id='cName' placeholder='Назва'><input id='cTag' placeholder='TAG'><button class='primary' onclick='doCreateClan()'>Створити</button>")}
async function doCreateClan(){try{await api("/api/clans/create",{method:"POST",body:JSON.stringify({name:$("cName").value,tag:$("cTag").value})});closeModal();me=(await api("/api/me")).user;render();loadClan()}catch(e){toast(e.message)}}
async function leaveClan(){try{await api("/api/clans/leave",{method:"POST"});me=(await api("/api/me")).user;render();loadClan()}catch(e){toast(e.message)}}
function searchClans(){openModal("<h2>Пошук клану</h2><div class='search'><input id='cq' placeholder='Назва або TAG'><button class='primary' onclick='doClanSearch()'>Пошук</button></div><div id='cr'></div>")}
async function doClanSearch(){try{const d=await api("/api/clans/search",{method:"POST",body:JSON.stringify({query:$("cq").value})});$("cr").innerHTML=d.clans.map(c=>"<div class='item row'><b>"+esc(c.name)+" ["+esc(c.tag)+"]</b><button class='primary' onclick=\"joinClan('"+esc(c.tag)+"')\">Заявка</button></div>").join("")||"<span class='muted'>Не знайдено.</span>"}catch(e){toast(e.message)}}
async function joinClan(tag){try{await api("/api/clans/request",{method:"POST",body:JSON.stringify({tag})});toast("Заявку відправлено");closeModal()}catch(e){toast(e.message)}}
async function loadInventory(){try{const d=await api("/api/inventory/my",{method:"POST",body:"{}"});$("inventoryList").innerHTML=d.inventory.map(x=>"<div class='panel'><div class='big'>"+esc(x.name)+"</div><div class='muted'>"+esc(x.rarity||"common")+"</div><button class='secondary' onclick=\"sellItem('"+esc(x.skinId)+"')\">Продати</button></div>").join("")||"<span class='muted'>Порожньо.</span>"}catch(e){}}
function sellItem(id){openModal("<h2>Продати</h2><input id='price' type='number' min='1' placeholder='Gold'><button class='primary' onclick=\"doSell('"+esc(id)+"')\">Виставити</button>")}
async function doSell(id){try{await api("/api/market/sell",{method:"POST",body:JSON.stringify({skinId:id,price:Number($("price").value)})});closeModal();loadInventory();loadMarket();toast("Виставлено")}catch(e){toast(e.message)}}
async function loadMarket(){try{const d=await api("/api/market/items");$("marketList").innerHTML=d.items.map(x=>"<div class='item row'><div><b>"+esc(x.skinName)+"</b><div class='muted'>"+esc(x.rarity)+" · "+esc(x.sellerNick)+"</div></div><div class='actions'><b>"+x.price+" G</b><button class='primary' onclick=\"buy('"+esc(x.lotId)+"')\">Купити</button></div></div>").join("")||"<span class='muted'>Ринок порожній.</span>"}catch(e){}}
async function buy(id){try{await api("/api/market/buy",{method:"POST",body:JSON.stringify({lotId:id})});me=(await api("/api/me")).user;render();loadMarket();loadInventory();toast("Куплено")}catch(e){toast(e.message)}}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};$("clanRefresh").onclick=loadClan;$("marketRefresh").onclick=loadMarket;
(async()=>{try{me=(await api("/api/me")).user;render();loadFriends();loadClan();loadInventory();loadMarket()}catch{location.href="/"}})();
</script></body></html>
