<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StandoffX Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d13;color:#edf3fa;font-family:Inter,Arial,sans-serif}body{background:radial-gradient(circle at 80% 10%,#17273a 0,#080d13 45%,#06090e 100%)}
button,input,select{font:inherit}button{cursor:pointer}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0c131c;border-bottom:1px solid #ffffff0d;position:sticky;top:0;z-index:10}.brand{font-weight:950;letter-spacing:1px}.brand b{color:#4e8dff}.topright{display:flex;gap:8px;align-items:center}.pill{padding:8px 11px;border-radius:7px;background:#091017;border:1px solid #ffffff0d;color:#aeb9c8;font-size:12px}
main{max-width:1450px;margin:auto;padding:22px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:16px;border:1px solid #ffffff0d;background:#101822;border-radius:9px}.stat small{color:#728197}.stat strong{display:block;font-size:27px;margin-top:5px}
.tabs{display:flex;gap:7px;margin:18px 0 12px;flex-wrap:wrap}.tab{border:1px solid #ffffff0d;background:#101822;color:#8492a5;border-radius:6px;padding:10px 14px}.tab.active{background:#1a2b43;color:#fff;border-color:#4e8dff}
.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:230px}
input,select{background:#080d13;color:#fff;border:1px solid #ffffff14;border-radius:7px;padding:10px;outline:none}input:focus,select:focus{border-color:#4e8dff}
.card{background:#101822;border:1px solid #ffffff0d;border-radius:9px;padding:16px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;text-align:left;border-bottom:1px solid #ffffff09;white-space:nowrap;font-size:12px}.muted{color:#748398;font-size:12px}
.primary,.secondary,.danger{border:0;border-radius:6px;padding:9px 13px;font-weight:800}.primary{background:#327cff;color:#fff}.secondary{background:#172230;color:#d9e3ef;border:1px solid #ffffff0e}.danger{background:#8f3043;color:#fff}.ok{color:#5fda94}.warn{color:#efc263}
.editor{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#78879a;font-size:11px;margin-bottom:5px}.checkrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.check{display:flex;align-items:center;gap:7px;color:#bdc8d5;font-size:12px}.check input{width:auto}
.clanlist{display:grid;gap:8px}.clanrow{padding:13px;background:#0b1118;border:1px solid #ffffff09;border-radius:7px}.clanrow b{font-size:13px}.notice{padding:10px 12px;background:#0b1420;border:1px solid #234264;border-radius:7px;color:#8eb7eb;font-size:12px;margin-bottom:12px}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.editor{grid-template-columns:1fr}}@media(max-width:600px){main{padding:12px}.top{padding:0 12px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand">STANDOFF<b>X</b> // ADMIN</div><div class="topright"><div id="storage" class="pill">...</div><button class="secondary" id="back">МЕНЮ</button></div></header>
<main>
<div class="stats">
<div class="stat"><small>USERS</small><strong id="usersN">—</strong></div><div class="stat"><small>ONLINE</small><strong id="onlineN">—</strong></div><div class="stat"><small>CLANS</small><strong id="clansN">—</strong></div><div class="stat"><small>MARKET</small><strong id="marketN">—</strong></div><div class="stat"><small>MESSAGES</small><strong id="messagesN">—</strong></div>
</div>
<div class="tabs"><button class="tab active" data-tab="users">USERS</button><button class="tab" data-tab="editor">EDITOR</button><button class="tab" data-tab="clans">CLANS</button><button class="tab" data-tab="database">DATABASE</button></div>

<section id="usersPanel" class="panel active"><div class="toolbar"><input id="search" placeholder="Пошук nickname / ID"><button class="primary" id="newUser">НОВИЙ</button><button class="secondary" id="refresh">ОНОВИТИ</button></div><div class="card table"><table><thead><tr><th>ID</th><th>NICK</th><th>GOLD</th><th>XP</th><th>CLAN</th><th>ADMIN</th><th>BAN</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>

<section id="editorPanel" class="panel">
<div id="editorNotice" class="notice">Обери користувача або створи нового.</div>
<div class="editor"><div class="card"><div class="formgrid">
<div class="field"><label>ID</label><input id="fId"></div><div class="field"><label>NICKNAME</label><input id="fNick"></div>
<div class="field"><label>NEW PASSWORD</label><input id="fPassword" type="password" placeholder="Не змінювати"></div><div class="field"><label>GOLD</label><input id="fGold" type="number" min="0"></div>
<div class="field"><label>XP</label><input id="fXP" type="number" min="0"></div><div class="field"><label>COMPETITIVE MMR</label><input id="fComp" type="number" min="0"></div>
<div class="field"><label>ALLIES MMR</label><input id="fAllies" type="number" min="0"></div><div class="field"><label>CLAN</label><select id="fClan"><option value="">Без клану</option></select></div>
</div>
<div class="checkrow"><label class="check"><input id="fAdmin" type="checkbox"> ADMIN</label><label class="check"><input id="fBan" type="checkbox"> BAN</label><label class="check"><input id="fVerified" type="checkbox"> VERIFIED</label></div>
<div style="display:flex;gap:8px;margin-top:15px"><button class="primary" id="saveUser">СОХРАНИТЬ</button><button class="danger" id="deleteUser">УДАЛИТЬ</button></div></div>
<div class="card"><h3 style="margin-top:0">ACCOUNT</h3><div id="selectedInfo" class="muted">—</div><p class="muted" style="line-height:1.5">Master Dev_01 нельзя удалить или лишить admin. Его пароль задаётся через ADMIN_PASSWORD на сервере.</p></div></div>
</section>

<section id="clansPanel" class="panel"><div class="card"><h2 style="margin-top:0">КЛАНЫ</h2><div id="clanList" class="clanlist"></div></div></section>
<section id="databasePanel" class="panel"><div class="card"><pre id="dump" style="white-space:pre-wrap;overflow:auto;max-height:70vh"></pre></div></section>
</main>

<script>
const $=id=>document.getElementById(id);
let users=[],clans={},selectedId=null,creating=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanId=id=>String(id||"").replace(/^ID_/i,"");
async function api(url,opt={}){const o={...opt,credentials:"same-origin",headers:{...(opt.headers||{})}};if(o.body&&typeof o.body==="string")o.headers["Content-Type"]="application/json";const r=await fetch(url,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Запит не виконано");return d}
function setTab(name){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===name));$("usersPanel").classList.toggle("active",name==="users");$("editorPanel").classList.toggle("active",name==="editor");$("clansPanel").classList.toggle("active",name==="clans");$("databasePanel").classList.toggle("active",name==="database")}
function fillClanOptions(){$("fClan").innerHTML="<option value=''>Без клану</option>"+Object.values(clans).map(c=>"<option value='"+esc(c.tag)+"'>["+esc(c.tag)+"] "+esc(c.name)+"</option>").join("")}
function fillEditor(u){creating=!u;selectedId=u?.id||null;$("editorNotice").textContent=creating?"Створення нового аккаунта":"Редагування: "+(u?.nickname||"");$("fId").value=creating?"":cleanId(u.id);$("fNick").value=creating?"":u.nickname||"";$("fPassword").value="";$("fGold").value=creating?0:u.gold||0;$("fXP").value=creating?0:u.XP||0;$("fComp").value=creating?1000:u.MMRCompetitive||1000;$("fAllies").value=creating?1000:u.MMRAllies||1000;$("fClan").value=creating?"":(u.clan||"");$("fAdmin").checked=creating?false:Boolean(u.isAdmin);$("fBan").checked=creating?false:Boolean(u.isBanned);$("fVerified").checked=creating?false:Boolean(u.isVerified);$("deleteUser").style.display=creating?"none":"inline-block";$("selectedInfo").textContent=creating?"Новий аккаунт":("Status: "+(u.status?"ONLINE":"OFFLINE")+" · ID "+cleanId(u.id));setTab("editor")}
function renderUsers(){const q=$("search").value.toLowerCase();$("rows").innerHTML=users.filter(u=>(String(u.id)+" "+String(u.nickname)).toLowerCase().includes(q)).map(u=>"<tr><td>"+esc(cleanId(u.id))+"</td><td>"+esc(u.nickname)+"</td><td>"+u.gold+"</td><td>"+u.XP+"</td><td>"+esc(u.clan||"—")+"</td><td>"+(u.isAdmin?"✓":"—")+"</td><td>"+(u.isBanned?"<span class='warn'>YES</span>":"—")+"</td><td><button class='secondary' data-edit='"+esc(u.id)+"'>EDIT</button></td></tr>").join("")||"<tr><td colspan='8' class='muted'>Нічого не знайдено.</td></tr>"}
function renderClans(){$("clanList").innerHTML=Object.values(clans).map(c=>{const members=users.filter(u=>u.clan===c.tag);const names=members.map(u=>esc(u.nickname)+" <span class='muted'>("+esc(cleanId(u.id))+")</span>").join(", ")||"<span class='muted'>Немає учасників</span>";return "<div class='clanrow'><b>"+esc(c.name)+" ["+esc(c.tag)+"]</b><div class='muted' style='margin:5px 0'>"+members.length+"/"+(c.memberLimit||30)+" · owner "+esc(cleanId(c.ownerId))+"</div><div>"+names+"</div></div>"}).join("")||"<div class='muted'>Кланів немає.</div>"}
async function load(){const o=await api("/api/admin/overview");$("usersN").textContent=o.users;$("onlineN").textContent=o.online;$("clansN").textContent=o.clans;$("marketN").textContent=o.market;$("messagesN").textContent=o.messages??"—";$("storage").textContent=o.storage;const d=await api("/api/admin/database");users=d.users||[];clans=d.clans||{};fillClanOptions();renderUsers();renderClans()}
$("search").oninput=renderUsers;$("refresh").onclick=()=>load().catch(e=>alert(e.message));$("newUser").onclick=()=>fillEditor(null);
$("rows").addEventListener("click",e=>{const b=e.target.closest("[data-edit]");if(b){const u=users.find(x=>String(x.id)===String(b.dataset.edit));if(u)fillEditor(u)}});
document.querySelectorAll(".tab").forEach(b=>b.onclick=async()=>{setTab(b.dataset.tab);if(b.dataset.tab==="database")$("dump").textContent=JSON.stringify(await api("/api/admin/database"),null,2)});
$("saveUser").onclick=async()=>{try{const payload={id:$("fId").value.trim(),nickname:$("fNick").value.trim(),password:$("fPassword").value,gold:Number($("fGold").value),XP:Number($("fXP").value),MMRCompetitive:Number($("fComp").value),MMRAllies:Number($("fAllies").value),clan:$("fClan").value,isAdmin:$("fAdmin").checked,isBanned:$("fBan").checked,isVerified:$("fVerified").checked};const d=creating?await api("/api/admin/users/create",{method:"POST",body:JSON.stringify(payload)}):await api("/api/admin/users/update",{method:"POST",body:JSON.stringify({...payload,userId:selectedId})});selectedId=d.user.id;creating=false;await load();fillEditor(users.find(u=>u.id===selectedId)||d.user);alert("Збережено")}catch(e){alert(e.message)}};
$("deleteUser").onclick=async()=>{if(creating||!selectedId)return;if(!confirm("Видалити "+selectedId+"?"))return;try{await api("/api/admin/users/"+encodeURIComponent(selectedId),{method:"DELETE"});selectedId=null;await load();fillEditor(null)}catch(e){alert(e.message)}};
$("back").onclick=()=>location.href="/game";load().catch(()=>location.href="/");
</script>
</body>
</html>
