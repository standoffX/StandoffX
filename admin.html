<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StandoffX Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#eef3ff;font:14px system-ui,Arial}header{height:64px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0a0f18}main{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d141f;border:1px solid #ffffff12;border-radius:14px;padding:16px}.num{font-size:28px;font-weight:800;margin-top:7px}.muted{color:#8997ab}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;background:#1b2637;color:#fff;cursor:pointer}button.active,button.primary{background:#2877ff}table{width:100%;border-collapse:collapse}.table{overflow:auto}.table th,.table td{padding:11px;text-align:left;border-bottom:1px solid #ffffff0d;white-space:nowrap}.danger{background:#a92f45}.ok{color:#63e6a4}.warn{color:#ffc857}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input{background:#080d15;color:#fff;border:1px solid #ffffff18;border-radius:8px;padding:9px}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header{padding:0 12px}.card{padding:12px}.num{font-size:22px}}</style></head>
<body><header><b>STANDOFFX // ADMIN</b><span id="db" class="muted">...</span></header><main>
<div class="grid"><div class="card">Users<div id="usersN" class="num">—</div></div><div class="card">Online<div id="onlineN" class="num">—</div></div><div class="card">Clans<div id="clansN" class="num">—</div></div><div class="card">Messages<div id="messagesN" class="num">—</div></div></div>
<div class="tabs"><button class="active" data-tab="users">Users</button><button data-tab="db">Database</button></div>
<section id="users"><div class="toolbar"><input id="search" placeholder="Пошук ID / nickname"><button id="refresh" class="primary">Оновити</button></div><div class="card table"><table><thead><tr><th>ID</th><th>Nickname</th><th>Gold</th><th>XP</th><th>Admin</th><th>Ban</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="database" class="hide"><div class="card"><pre id="dump" style="white-space:pre-wrap;overflow:auto;max-height:65vh"></pre></div></section>
</main>
<script>
const $=x=>document.getElementById(x);let users=[];
async function api(url,opt){const r=await fetch(url,{credentials:"include",...opt});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){const o=await api("/api/admin/overview");$("usersN").textContent=o.users;$("onlineN").textContent=o.online;$("clansN").textContent=o.clans;$("messagesN").textContent=o.messages;$("db").textContent=o.storage;users=(await api("/api/admin/users")).users;render()}
function render(){const q=$("search").value.toLowerCase();$("rows").innerHTML=users.filter(u=>(u.id+" "+u.nickname).toLowerCase().includes(q)).map(u=>`<tr><td>${u.id}</td><td>${u.nickname}</td><td>${u.gold}</td><td>${u.XP}</td><td>${u.isAdmin?"✓":"—"}</td><td>${u.isBanned?"<span class='warn'>YES</span>":"—"}</td><td><button onclick="editUser('${u.id}')">Edit</button> <button class="danger" onclick="delUser('${u.id}')">Delete</button></td></tr>`).join("")}
window.editUser=async id=>{const u=users.find(x=>x.id===id);if(!u)return;const gold=prompt("Gold",u.gold),xp=prompt("XP",u.XP),ban=confirm("Заблокировать?");await api("/api/admin/users/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:id,gold,XP:xp,isBanned:ban})});load()}
window.delUser=async id=>{if(confirm("Видалити "+id+"?")){await api("/api/admin/users/"+encodeURIComponent(id),{method:"DELETE"});load()}}
$("search").oninput=render;$("refresh").onclick=load;
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=async()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("users").classList.toggle("hide",b.dataset.tab!=="users");$("database").classList.toggle("hide",b.dataset.tab!=="db");if(b.dataset.tab==="db")$("dump").textContent=JSON.stringify(await api("/api/admin/database"),null,2)});
load().catch(()=>location.href="/");
</script></body></html>
